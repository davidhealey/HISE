name: Nightly Build
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Build even if there are no new commits'
        required: false
        default: false
        type: boolean

env:
  JUCE_BRANCH: juce6

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - id: detect
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$(git log --since='24 hours ago' --format=%H -n 1)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  build_windows:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          submodules: false
      - name: Checkout JUCE
        shell: bash
        run: |
          git submodule update --init JUCE
          cd JUCE
          git fetch origin
          git checkout "$JUCE_BRANCH"
          git pull origin "$JUCE_BRANCH"
      - name: Extract SDKs
        shell: pwsh
        run: Expand-Archive -Path tools/SDK/sdk.zip -DestinationPath tools/SDK -Force
      - name: Install Faust
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo grame-cncm/faust --pattern "Faust-*-win64.exe" --output faust-installer.exe
          Start-Process -FilePath .\faust-installer.exe -ArgumentList "/S" -Wait
          if (-not (Test-Path "C:\Program Files\Faust\lib\faust.dll")) { throw "Faust installation failed" }
      - name: Resave project
        shell: cmd
        run: JUCE\projucer\Projucer.exe --resave "projects\standalone\HISE Standalone.jucer"
      - name: Build HISE
        shell: cmd
        run: |
          for /d %%d in ("projects\standalone\Builds\VisualStudio*") do msbuild "%%d\HISE Standalone.sln" /t:Build /p:Configuration=ReleaseWithFaust /p:Platform=x64 /v:m
      - uses: actions/upload-artifact@v4
        with:
          name: HISE-windows-x64
          path: |
            projects/standalone/Builds/VisualStudio*/x64/ReleaseWithFaust/App/HISE.exe
            projects/standalone/Builds/VisualStudio*/x64/ReleaseWithFaust/App/faust.dll
          retention-days: 14

  build_macos:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          submodules: false
      - name: Checkout JUCE
        run: |
          git submodule update --init JUCE
          cd JUCE
          git fetch origin
          git checkout "$JUCE_BRANCH"
          git pull origin "$JUCE_BRANCH"
      - name: Extract SDKs
        run: cd tools/SDK && tar -xf sdk.zip
      - name: Install Faust (universal)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for arch in arm64 x64; do
            gh release download --repo grame-cncm/faust --pattern "Faust-*-$arch.dmg" --output faust-$arch.dmg
            hdiutil attach faust-$arch.dmg -mountpoint /Volumes/Faust-$arch -nobrowse -quiet
            mkdir faust-$arch
            cp -R /Volumes/Faust-$arch/Faust-*/* faust-$arch/ 2>/dev/null || cp -R /Volumes/Faust-$arch/* faust-$arch/
            hdiutil detach /Volumes/Faust-$arch -quiet
          done
          cp -R faust-arm64/* tools/faust/
          for lib in faust-arm64/lib/*.dylib; do
            if [ -f "$lib" ] && [ ! -L "$lib" ]; then
              lipo -create "$lib" "faust-x64/lib/$(basename "$lib")" -output "tools/faust/lib/$(basename "$lib")"
            fi
          done
          lipo -info tools/faust/lib/libfaust.dylib
      - name: Resave project
        run: |
          chmod +x "JUCE/projucer/Projucer.app/Contents/MacOS/Projucer"
          "JUCE/projucer/Projucer.app/Contents/MacOS/Projucer" --resave "projects/standalone/HISE Standalone.jucer"
      - name: Build HISE
        run: |
          xcodebuild -project "projects/standalone/Builds/MacOSX/HISE Standalone.xcodeproj" -configuration ReleaseWithFaust ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO
      - name: Package
        run: |
          mkdir dist
          cp -R projects/standalone/Builds/MacOSX/build/ReleaseWithFaust/HISE.app dist/
          cp -R tools/faust/lib dist/faust_lib
          ditto -c -k dist HISE-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: HISE-macos
          path: HISE-macos.zip
          retention-days: 14

  build_linux:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          submodules: false
      - name: Checkout JUCE
        run: |
          git submodule update --init JUCE
          cd JUCE
          git fetch origin
          git checkout "$JUCE_BRANCH"
          git pull origin "$JUCE_BRANCH"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install build-essential make llvm clang libfreetype6-dev libx11-dev libxinerama-dev \
            libxrandr-dev libxcursor-dev mesa-common-dev libasound2-dev freeglut3-dev libxcomposite-dev \
            libcurl4-gnutls-dev libgtk-3-dev libjack-jackd2-dev libwebkit2gtk-4.0-dev libpthread-stubs0-dev ladspa-sdk \
            libfftw3-dev cmake llvm-dev libncurses-dev zlib1g-dev unzip
      - name: Extract SDKs
        run: cd tools/SDK && unzip -q sdk.zip
      - name: Build and install Faust
        run: |
          git clone --depth 1 https://github.com/grame-cncm/faust.git
          make -C faust dynamic -j$(nproc)
          sudo make -C faust install
          sudo ldconfig
      - name: Resave project
        run: |
          chmod +x JUCE/Projucer/Projucer
          JUCE/Projucer/Projucer --resave "projects/standalone/HISE Standalone.jucer"
      - name: Build HISE
        working-directory: projects/standalone/Builds/LinuxMakefile
        run: make CONFIG=ReleaseWithFaust AR=gcc-ar -j$(nproc)
      - name: Package
        run: tar -czf HISE-linux-x64.tar.gz -C projects/standalone/Builds/LinuxMakefile/build HISE
      - uses: actions/upload-artifact@v4
        with:
          name: HISE-linux-x64
          path: HISE-linux-x64.tar.gz
          retention-days: 14
